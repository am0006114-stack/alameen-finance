name: Phase 15 Model-Native Atomic Conversation Verify

on:
  push:
    branches:
      - phase15-model-native-atomic-conversation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-model-native-atomic-conversation
          fetch-depth: 0

      - name: Apply Phase 15 architectural patch
        run: python3 scripts/apply-phase15-model-native-atomic-conversation.py

      - name: Root-cause conversation regression gate
        run: node scripts/v3-phase15-model-native-atomic-conversation-selftest.cjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile gate
        run: npx tsc --noEmit

      - name: Production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: phase15-ci-inert-anon-key
          SUPABASE_SERVICE_ROLE_KEY: phase15-ci-inert-service-role-key
        run: npm run build

      - name: Diff hygiene gate
        run: git diff --check

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-phase15-model-native-atomic-conversation.py
          rm .github/workflows/phase15-model-native-atomic-conversation-verify.yml

      - name: Stage exact runtime scope
        run: |
          git add app/api/whatsapp/webhook/_lib/v3-os/stateStore.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/responseArbiter.ts
          git add app/api/whatsapp/webhook/route.ts
          git add -u scripts/apply-phase15-model-native-atomic-conversation.py .github/workflows/phase15-model-native-atomic-conversation-verify.yml

      - name: Verify exact staged scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/phase15-model-native-atomic-conversation-verify.yml' \
            'app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/responseArbiter.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/stateStore.ts' \
            'app/api/whatsapp/webhook/route.ts' \
            'scripts/apply-phase15-model-native-atomic-conversation.py' | sort)"
          echo "ACTUAL:"
          printf '%s\n' "$actual"
          echo "EXPECTED:"
          printf '%s\n' "$expected"
          test "$actual" = "$expected"

      - name: Commit verified Phase 15
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'alameen-phase15-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Phase 15: make conversation model-native and delivery-context atomic'
          git push origin HEAD:phase15-model-native-atomic-conversation
