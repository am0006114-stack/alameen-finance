name: Phase 15.1 Human Persona Identity Scope Verify

on:
  push:
    branches:
      - phase15-1-human-persona-identity-scope

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-1-human-persona-identity-scope
          fetch-depth: 0

      - name: Apply Phase 15.1 persona identity patch
        run: python3 scripts/apply-phase15-1-human-persona-identity-scope.py

      - name: Identity and persona regression gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          brain = Path('app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts').read_text(encoding='utf-8')
          os = Path('app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts').read_text(encoding='utf-8')
          assert 'مساعد ذكاء اصطناعي تابع للأمين' not in brain
          assert 'أنا المساعد الرقمي التابع للأمين' in brain
          assert 'customerMessage الحالي وحده يفتح سؤال طبيعة المجيب' in brain
          assert 'أنا المساعد الرقمي التابع للأمين. خليني أكمل معك على نفس موضوعك.' in os
          assert 'مش شخص بشري. بقدر أجاوبك' not in os
          start = os.index('function explicitAssistantIdentityQuestion')
          end = os.index('function explicitAssistantIdentityReply', start)
          detector = os[start:end]
          assert 'شو|ما)\\s+اسمك' not in detector
          assert 'مين\\s+انت' not in detector
          assert 'المسؤول|المسوول' not in detector
          assert 'const explicitManagerQuestion = explicitManagerIdentityQuestion(input.customerText);' in os
          print('PHASE 15.1 IDENTITY/PERSONA REGRESSION GATE PASS')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile gate
        run: npx tsc --noEmit

      - name: Production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: phase15-1-ci-inert-anon-key
          SUPABASE_SERVICE_ROLE_KEY: phase15-1-ci-inert-service-role-key
        run: npm run build

      - name: Diff hygiene gate
        run: git diff --check

      - name: Remove one-time verification machinery
        run: |
          rm -f scripts/apply-phase15-1-human-persona-identity-scope.py
          rm -f .github/workflows/phase15-1-human-persona-identity-scope-verify.yml

      - name: Stage exact runtime scope
        run: |
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts
          git add -u scripts/apply-phase15-1-human-persona-identity-scope.py .github/workflows/phase15-1-human-persona-identity-scope-verify.yml

      - name: Verify final branch scope versus main
        run: |
          git diff --cached --check
          git config user.name 'alameen-phase15-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Phase 15.1: restore employee persona and scope identity disclosure'
          git push origin HEAD:phase15-1-human-persona-identity-scope
          git fetch origin main --quiet
          echo 'FINAL DIFF VS MAIN:'
          git diff --name-only origin/main...HEAD
          test "$(git diff --name-only origin/main...HEAD | sort)" = "$(printf '%s\n' 'app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts' 'app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts' | sort)"
