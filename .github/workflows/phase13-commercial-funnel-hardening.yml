name: Phase 13 Commercial Funnel Hardening

on:
  push:
    branches:
      - phase13-commercial-funnel-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Phase 13 patch
        run: node scripts/phase13-apply-patch.cjs

      - name: Run Phase 13 regression gate
        run: node scripts/v3-phase13-commercial-funnel-hardening-selftest.cjs

      - name: Remove one-time patch machinery
        run: |
          git rm .github/workflows/phase13-commercial-funnel-hardening.yml
          git rm scripts/phase13-apply-patch.cjs

      - name: Commit exact Phase 13 files
        run: |
          git config user.name "alameen-phase13-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/api/whatsapp/webhook/_lib/v3-os/informedCommercialContinuation.ts \
            app/api/whatsapp/webhook/_lib/v3-os/actionPlane.ts \
            app/api/whatsapp/webhook/_lib/v3-os/continuationPersistence.ts \
            app/api/whatsapp/webhook/_lib/v3-os/productionTruth.ts \
            app/api/whatsapp/webhook/_lib/v3-os/currentHumanTurnAuthority.ts \
            app/api/whatsapp/webhook/_lib/v3-os/responseArbiter.ts \
            app/api/whatsapp/webhook/_lib/v3-os/semanticQuestionLocks.ts \
            scripts/v3-phase13-commercial-funnel-hardening-selftest.cjs \
            .github/workflows/phase13-commercial-funnel-hardening.yml \
            scripts/phase13-apply-patch.cjs
          git commit -m "Phase 13: harden commercial funnel and payment recovery"
          git push origin HEAD:phase13-commercial-funnel-hardening
