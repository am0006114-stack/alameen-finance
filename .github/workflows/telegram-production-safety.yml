name: Telegram Production Safety

on:
  pull_request:
    paths:
      - 'app/api/telegram/**'
      - 'app/api/postpayment/**'
      - 'app/api/web-chat/**'
      - 'app/chat/**'
      - 'app/api/whatsapp/webhook/_lib/v3-os/telegramMigration.ts'
      - 'supabase/migrations/**'
      - 'scripts/v3-phase18-6-1-telegram-handoff-ux-selftest.cjs'
      - '.github/workflows/telegram-production-safety.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  telegram-production-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: P0 five JOD any-inbound gate
        run: node scripts/v3-p0-five-jod-any-inbound-selftest.cjs

      - name: P0 five JOD conversion-egress gate
        run: node scripts/v3-p0-five-jod-conversion-egress-selftest.cjs

      - name: Phase 18.6.1 Telegram handoff and UX safety gate
        run: node scripts/v3-phase18-6-1-telegram-handoff-ux-selftest.cjs

      - name: WhatsApp integrity without payment-guard changes
        run: node scripts/v3-p0-whatsapp-integrity-repair-selftest.cjs

      - name: TypeScript
        run: npx tsc --noEmit

      # Full Next.js production build is intentionally reserved for the final
      # Vercel deployment because project compute is near its monthly limit.
      # This PR workflow remains static/local and receives no production secrets.
