name: Phase 14.3.1 Contextual Bank Follow-up Verify

on:
  push:
    branches:
      - phase14-3-1-contextual-bank-followup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14-3-1-contextual-bank-followup
          fetch-depth: 0

      - name: Apply Phase 14.3.1 patch
        run: python3 scripts/apply-phase14-3-1-contextual-bank-followup.py

      - name: Contextual follow-up regression gate
        run: node scripts/v3-phase14-3-1-contextual-bank-followup-selftest.cjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile gate
        run: npx tsc --noEmit

      - name: Production build gate
        run: npm run build

      - name: Diff hygiene gate
        run: git diff --check

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-phase14-3-1-contextual-bank-followup.py
          rm .github/workflows/phase14-3-1-contextual-bank-followup-verify.yml

      - name: Stage exact runtime scope
        run: |
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/answerObligations.ts
          git add scripts/v3-phase14-3-1-contextual-bank-followup-selftest.cjs
          git add -u scripts/apply-phase14-3-1-contextual-bank-followup.py .github/workflows/phase14-3-1-contextual-bank-followup-verify.yml

      - name: Verify exact staged scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            app/api/whatsapp/webhook/_lib/v3-os/answerObligations.ts \
            app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts \
            scripts/v3-phase14-3-1-contextual-bank-followup-selftest.cjs | sort)"
          echo "ACTUAL:"
          printf '%s\n' "$actual"
          echo "EXPECTED:"
          printf '%s\n' "$expected"
          test "$actual" = "$expected"

      - name: Commit verified Phase 14.3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'alameen-phase14-3-1-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Phase 14.3.1: consume bank-name follow-up deterministically'
          git push origin HEAD:phase14-3-1-contextual-bank-followup
