name: Phase 16 Conversation Root Rebuild Verify

on:
  push:
    branches:
      - phase16-conversation-root-audit-rebuild

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase16-conversation-root-audit-rebuild
          fetch-depth: 0
          clean: false

      - name: Apply Phase 16 root rebuild
        run: |
          python3 scripts/apply-phase16-conversation-root-rebuild.py
          python3 scripts/apply-phase16-conversation-root-rebuild-followup.py
          python3 scripts/apply-phase16-test-modernization.py

      - name: Screenshot root regression gate
        run: node scripts/v3-phase16-conversation-root-rebuild-selftest.cjs

      - name: Persona and conversation architecture regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v3-phase14-2-persona-selftest.cjs
          node scripts/v3-phase14-conversation-os-audit-selftest.cjs
          node scripts/v3-phase14-3-1-contextual-bank-followup-selftest.cjs
          node scripts/v3-phase15-model-native-atomic-conversation-selftest.cjs
          node scripts/v3-phase13-1-root-current-turn-supremacy-selftest.cjs

      - name: Install dependencies
        run: npm ci

      - name: Commercial funnel and action-truth regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v3-phase12-clean-commercial-funnel-selftest.cjs
          node scripts/v3-human-os-continuation-consume-selftest.cjs
          node scripts/v3-phase11-5-canonical-ingress-burst-mutation-receipt-selftest.cjs

      - name: Customer-facing implementation identity scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          forbidden = [
            'وبالمحادثة هاي أنا مساعد ذكاء اصطناعي تابع للأمين',
            'والرد هون آلي من نظام الأمين',
            'أنا مساعد ذكاء اصطناعي تابع للأمين، مش شخص بشري',
            'أنا مساعد ذكاء اصطناعي تابع للأمين للأقساط، مش موظف بشري',
            'بيتوقف الرد الآلي على المحادثة',
          ]
          problems=[]
          for p in Path('app/api/whatsapp/webhook').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.ts','.tsx','.js','.cjs','.mjs'}:
              continue
            s=p.read_text(encoding='utf-8')
            for phrase in forbidden:
              if phrase in s:
                problems.append((str(p), phrase))
          if problems:
            for p,phrase in problems: print('FORBIDDEN', p, phrase)
            raise SystemExit('customer-facing implementation identity signature survived')
          print('PASS customer-facing implementation identity scan')
          PY

      - name: TypeScript compile gate
        run: npx tsc --noEmit

      - name: Production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: phase16-ci-inert-anon-key
          SUPABASE_SERVICE_ROLE_KEY: phase16-ci-inert-service-role-key
        run: npm run build

      - name: Diff hygiene gate
        run: git diff --check

      - name: Remove one-time audit and patch machinery
        run: |
          rm -f .github/workflows/phase16-conversation-root-audit.yml
          rm -f .github/workflows/phase16-conversation-root-rebuild-verify.yml
          rm -f scripts/apply-phase16-conversation-root-rebuild.py
          rm -f scripts/apply-phase16-conversation-root-rebuild-followup.py
          rm -f scripts/apply-phase16-test-modernization.py

      - name: Stage exact Phase 16 scope
        run: |
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/answerObligations.ts
          git add app/api/whatsapp/webhook/route.ts
          git add app/api/whatsapp/webhook/_lib/v2-production/actionExecutor.ts
          git add scripts/v3-phase14-2-persona-selftest.cjs
          git add scripts/v3-phase14-conversation-os-audit-selftest.cjs
          git add scripts/v3-phase14-3-1-contextual-bank-followup-selftest.cjs
          git add scripts/v3-phase16-conversation-root-rebuild-selftest.cjs
          git add -u .github/workflows/phase16-conversation-root-audit.yml
          git add -u .github/workflows/phase16-conversation-root-rebuild-verify.yml
          git add -u scripts/apply-phase16-conversation-root-rebuild.py
          git add -u scripts/apply-phase16-conversation-root-rebuild-followup.py
          git add -u scripts/apply-phase16-test-modernization.py

      - name: Final exact scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name 'alameen-phase16-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Phase 16: rebuild employee-first current-turn conversation authority'
          git push origin HEAD:phase16-conversation-root-audit-rebuild
          git fetch origin main --quiet
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            'app/api/whatsapp/webhook/_lib/v2-production/actionExecutor.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/answerObligations.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/humanConversationOS.ts' \
            'app/api/whatsapp/webhook/route.ts' \
            'scripts/v3-phase14-2-persona-selftest.cjs' \
            'scripts/v3-phase14-3-1-contextual-bank-followup-selftest.cjs' \
            'scripts/v3-phase14-conversation-os-audit-selftest.cjs' \
            'scripts/v3-phase16-conversation-root-rebuild-selftest.cjs' | sort)"
          echo 'FINAL DIFF VS MAIN:'
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
