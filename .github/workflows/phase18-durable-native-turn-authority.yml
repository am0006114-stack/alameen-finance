name: Phase 18 Durable Native Turn Authority

on:
  push:
    branches:
      - phase18-durable-native-turn-authority

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: startsWith(github.event.head_commit.message, 'Bootstrap Phase 18 patch runner') || startsWith(github.event.head_commit.message, 'Phase 18 CI build env fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Apply guarded Phase 18 patch
        run: node scripts/phase18-apply.cjs

      - name: Install dependencies
        run: npm ci

      - name: Phase 18 regression gate
        run: node scripts/v3-phase18-durable-native-turn-authority-selftest.cjs

      - name: Preserve Phase 17 single-writer gates
        run: |
          node scripts/v3-phase17-single-writer-conversation-cutover-selftest.cjs
          node scripts/v3-phase17-native-kernel-safety-selftest.cjs

      - name: TypeScript gate
        run: npx tsc --noEmit --pretty false

      - name: Production build gate
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://phase18-ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: phase18-ci-placeholder-service-role-key

      - name: Diff and protected-path gate
        run: |
          git diff --check
          test -z "$(git diff --name-only 1220069fc1772928aec33d05e15481b9350f0c9f -- app/api/whatsapp/webhook/_lib/v3-os/informedCommercialContinuation.ts app/api/whatsapp/webhook/_lib/v3-os/continuationPersistence.ts app/api/whatsapp/webhook/_lib/v3-os/conversationRecovery.ts app/api/whatsapp/webhook/_lib/v3-os/paymentDestinationOverride.ts)"

      - name: Commit validated Phase 18 source
        run: |
          git config user.name "alameen-phase18-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            app/api/whatsapp/webhook/_lib/v3-os/runtimeLive.ts \
            app/api/whatsapp/webhook/_lib/v3-os/stateStore.ts \
            app/api/whatsapp/webhook/_lib/v3-os/turnIntegrity.ts \
            app/api/whatsapp/webhook/_lib/v3-os/types.ts \
            app/delay-decision/page.tsx \
            scripts/v3-phase18-durable-native-turn-authority-selftest.cjs
          git diff --cached --check
          git commit -m "[phase18-applied] Add durable native turn authority and true single egress"
          git push origin HEAD:phase18-durable-native-turn-authority
