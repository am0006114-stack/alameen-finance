name: Phase 14.1 WhatsApp Typing Restoration

on:
  push:
    branches:
      - phase14-1-whatsapp-typing-api-restoration

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply typing restoration
        run: node scripts/phase14-1-typing-patch.cjs

      - name: Typing restoration regression gate
        run: node scripts/v3-phase14-1-typing-restoration-selftest.cjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile gate
        run: npx tsc --noEmit

      - name: Production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: phase14-ci-inert-anon-key
          SUPABASE_SERVICE_ROLE_KEY: phase14-ci-inert-service-role-key
        run: npm run build

      - name: Diff hygiene gate
        run: git diff --check

      - name: Remove one-time patch machinery
        run: |
          git rm .github/workflows/phase14-1-whatsapp-typing-restoration.yml
          git rm scripts/phase14-1-typing-patch.cjs

      - name: Stage exact runtime change
        run: |
          git add app/api/whatsapp/webhook/route.ts
          git add scripts/v3-phase14-1-typing-restoration-selftest.cjs

      - name: Verify exact staged scope
        shell: bash
        run: |
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/phase14-1-whatsapp-typing-restoration.yml' \
            'app/api/whatsapp/webhook/route.ts' \
            'scripts/phase14-1-typing-patch.cjs' | sort)"
          echo "$actual"
          test "$actual" = "$expected"

      - name: Commit and push verified typing fix
        run: |
          git config user.name "alameen-phase14-1-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Phase 14.1: restore WhatsApp typing indicator API compatibility"
          git push origin HEAD:phase14-1-whatsapp-typing-api-restoration
