name: Phase 14.3 Humanization Verify

on:
  push:
    branches:
      - phase14-3-humanization-concise-context

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Phase 14.3 humanization patch
        run: node scripts/phase14-3-humanization-patch.cjs

      - name: Humanization regression gate
        run: node scripts/v3-phase14-3-humanization-selftest.cjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile gate
        run: npx tsc --noEmit

      - name: Production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: phase14-3-ci-inert-anon-key
          SUPABASE_SERVICE_ROLE_KEY: phase14-3-ci-inert-service-role-key
        run: npm run build

      - name: Diff hygiene gate
        run: git diff --check

      - name: Remove one-time patch machinery
        run: |
          git rm .github/workflows/phase14-3-humanization-verify.yml
          git rm scripts/phase14-3-humanization-patch.cjs

      - name: Stage exact runtime scope
        run: |
          git add app/api/whatsapp/webhook/_lib/constants.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/answerObligations.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts
          git add app/api/whatsapp/webhook/_lib/v3-os/freshPublicFacts.ts
          git add scripts/v3-phase14-3-humanization-selftest.cjs

      - name: Verify exact staged scope
        shell: bash
        run: |
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/phase14-3-humanization-verify.yml' \
            'app/api/whatsapp/webhook/_lib/constants.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/answerObligations.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/freshPublicFacts.ts' \
            'app/api/whatsapp/webhook/_lib/v3-os/humanConversationBrain.ts' \
            'scripts/phase14-3-humanization-patch.cjs' | sort)"
          echo "$actual"
          test "$actual" = "$expected"

      - name: Commit verified Phase 14.3
        run: |
          git config user.name "alameen-phase14-3-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Phase 14.3: concise human dialogue and contextual follow-up"
          git push origin HEAD:phase14-3-humanization-concise-context
